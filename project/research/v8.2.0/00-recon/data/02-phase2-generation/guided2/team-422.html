<div id="invite-form">
<form class="flex flex-col gap-4" data-behavior="resetOnSuccess" hx-post="/team/members" hx-target="#main-content" hx-swap="outerMorph" hx-indicator="#global-loading" hx-disable="findAll button" hx-status:422="swap:outerMorph target:#invite-form push:false" novalidate="" data-htmx-powered="true"><div class="flex flex-col gap-1"><label class="text-sm font-medium text-text" for="invite-name">Name</label>
<input id="invite-name" class="w-full px-4 py-3 border-2 border-line rounded-control transition-colors focus:border-primary focus:outline-hidden" type="text" name="name" maxlength="80" autocomplete="off" required="" value="" aria-invalid="true" aria-describedby="invite-name-error">
<div class="text-sm text-danger empty:hidden"><span id="invite-name-error">Name is required.</span></div></div>
<div class="flex flex-col gap-1"><label class="text-sm font-medium text-text" for="invite-email">Email</label>
<input id="invite-email" class="w-full px-4 py-3 border-2 border-line rounded-control transition-colors focus:border-primary focus:outline-hidden" type="email" name="email" maxlength="254" autocomplete="off" required="" value="not-an-email" aria-invalid="true" aria-describedby="invite-email-error">
<div class="text-sm text-danger empty:hidden"><span id="invite-email-error">Enter a valid email address.</span></div></div>
<div class="flex flex-col gap-1"><label class="text-sm font-medium text-text" for="invite-role">Role</label>
<select id="invite-role" class="w-full px-4 py-3 border-2 border-line rounded-control transition-colors focus:border-primary focus:outline-hidden" name="role"><option value="member" selected="">Member</option>
<option value="admin">Admin</option>
<option value="owner">Owner</option></select>
<div class="text-sm text-danger empty:hidden"></div></div>
<div><button class="bg-primary text-on-accent rounded-control font-medium transition-colors hover:bg-primary-700 px-6 py-3 cursor-pointer" type="submit">Send invite</button></div></form></div>
