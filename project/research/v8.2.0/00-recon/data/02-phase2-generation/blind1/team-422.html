<div id="invite-form" class="bg-surface rounded-card shadow-sm border border-line p-6"><div class="mb-6"><h2 class="text-lg font-semibold text-text">Invite member</h2>
<p class="text-sm text-text-dim mt-1">They show as invited until they accept.</p></div>

<form data-behavior="resetOnSuccess" hx-post="/team/invite" hx-target="#main-content" hx-swap="outerMorph" hx-indicator="#global-loading" hx-disable="findAll button" hx-status:422="swap:outerMorph target:#invite-form push:false" novalidate="" data-htmx-powered="true"><div class="grid gap-4 sm:grid-cols-3"><div><label class="text-sm font-medium text-text mb-1 block" for="invite-name">Name</label>
<input id="invite-name" class="w-full px-4 py-3 border-2 border-line rounded-control transition-colors focus:border-primary focus:outline-hidden" type="text" name="name" maxlength="80" required="" value="" aria-invalid="true" aria-describedby="invite-name-error">
<p class="text-sm text-danger mt-1"><span id="invite-name-error">Name is required.</span></p></div>
<div><label class="text-sm font-medium text-text mb-1 block" for="invite-email">Email</label>
<input id="invite-email" class="w-full px-4 py-3 border-2 border-line rounded-control transition-colors focus:border-primary focus:outline-hidden" type="email" name="email" maxlength="254" required="" value="not-an-email" aria-invalid="true" aria-describedby="invite-email-error">
<p class="text-sm text-danger mt-1"><span id="invite-email-error">Enter a valid email address, like name@example.com.</span></p></div>
<div><label class="text-sm font-medium text-text mb-1 block" for="invite-role">Role</label>
<select id="invite-role" class="w-full px-4 py-3 border-2 border-line rounded-control transition-colors focus:border-primary focus:outline-hidden" name="role"><option value="owner">Owner</option>
<option value="admin">Admin</option>
<option value="member" selected="">Member</option></select>
</div></div>
<button class="bg-primary text-on-accent rounded-control font-medium transition-colors hover:bg-primary-700 px-6 py-3 cursor-pointer mt-6" type="submit">Send invite</button></form></div>
