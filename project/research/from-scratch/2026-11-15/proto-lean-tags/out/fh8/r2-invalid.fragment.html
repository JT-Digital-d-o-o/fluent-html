<form id="projectForm" class="grid max-w-lg gap-4" action="/projects" method="post" hx-post="/projects" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" hx-indicator="#global-loading" hx-disable="findAll button" hx-status:422="swap:outerMorph target:#projectForm push:false"><label class="grid gap-1 text-sm font-medium">Name
<input id="name" class="rounded-control border border-line bg-surface px-3 py-2 font-normal aria-[invalid=true]:border-danger" type="text" name="name" value="" maxlength="80" aria-invalid="true" aria-describedby="name-error" required>
<span class="font-normal text-danger"><span id="name-error">Name is required</span></span></label>
<label class="grid gap-1 text-sm font-medium">Description
<textarea id="description" class="rounded-control border border-line bg-surface px-3 py-2 font-normal aria-[invalid=true]:border-danger" name="description" rows="4" aria-invalid="true" aria-describedby="description-error">xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</textarea>
<span class="font-normal text-danger"><span id="description-error">Keep the description under 500 characters</span></span></label>
<label class="grid gap-1 text-sm font-medium">Status
<select id="status" class="rounded-control border border-line bg-surface px-3 py-2 font-normal aria-[invalid=true]:border-danger" name="status" aria-invalid="true" aria-describedby="status-error"><option value="active">Active</option>
<option value="paused">Paused</option></select>
<span class="font-normal text-danger"><span id="status-error">Choose one of: active, paused</span></span></label>
<div class="flex gap-3"><button class="inline-flex cursor-pointer items-center rounded-control px-4 py-2 text-sm font-medium focus-visible:ring-2 bg-primary text-on-accent hover:bg-primary-700" type="submit">Create project</button>
<a class="cursor-pointer inline-flex cursor-pointer items-center rounded-control px-4 py-2 text-sm font-medium focus-visible:ring-2 border border-line hover:bg-surface-2" href="/projects" hx-get="/projects" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" hx-indicator="#global-loading" hx-sync="#main-content:replace">Cancel</a></div></form>
