<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<meta name="description" content="Projects in the project tracker."></head>
<body><main id="main-content" class="mx-auto max-w-3xl px-4 py-8"><div class="flex items-center justify-between"><h1 class="text-2xl font-semibold">Projects</h1>
<a class="cursor-pointer inline-flex cursor-pointer items-center rounded-control px-4 py-2 text-sm font-medium focus-visible:ring-2 bg-primary text-on-accent hover:bg-primary-700" href="/projects/new" hx-get="/projects/new" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" hx-indicator="#global-loading" hx-sync="#main-content:replace">New project</a></div>
<input class="mt-6 w-full rounded-control border border-line bg-surface px-3 py-2 text-sm" type="search" name="q" placeholder="Search projects" value="" aria-label="Search projects" hx-get="/projects/rows" hx-target="#projectList" hx-swap="outerMorph" hx-trigger="input changed delay:300ms" hx-include="this" hx-indicator="#global-loading" hx-sync="replace">
<div class="mt-4"><div id="projectList" class="rounded-card border border-line bg-surface"><ul class="divide-y divide-line"><li id="project-1"><a class="cursor-pointer flex items-center justify-between gap-4 px-4 py-3 hover:bg-surface-2" href="/projects/1" hx-get="/projects/1" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" hx-indicator="#global-loading" hx-sync="#main-content:replace"><div><p class="font-medium">Atlas &lt;redesign&gt;</p>
<p class="text-sm text-text-dim">Q3 &amp; Q4 site refresh</p></div>
<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-success/10 text-success capitalize">active</span></a></li>
<li id="project-2"><a class="cursor-pointer flex items-center justify-between gap-4 px-4 py-3 hover:bg-surface-2" href="/projects/2" hx-get="/projects/2" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" hx-indicator="#global-loading" hx-sync="#main-content:replace"><div><p class="font-medium">Billing export</p>
<p class="text-sm text-text-dim"></p></div>
<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-warning/10 text-warning capitalize">paused</span></a></li></ul></div></div></main></body></html>
