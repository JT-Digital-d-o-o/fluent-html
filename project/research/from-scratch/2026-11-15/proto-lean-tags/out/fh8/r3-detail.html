<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas &lt;redesign&gt;</title>
<meta name="description" content="Atlas &lt;redesign&gt; in the project tracker."></head>
<body><main id="main-content" class="mx-auto max-w-3xl px-4 py-8"><a class="cursor-pointer text-sm text-text-dim hover:underline" href="/projects" hx-get="/projects" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" hx-indicator="#global-loading" hx-sync="#main-content:replace">Projects</a>
<div class="mt-2 flex items-start justify-between gap-4"><div><h1 class="text-2xl font-semibold">Atlas &lt;redesign&gt;</h1>
<p class="mt-1 text-text-dim">Q3 &amp; Q4 site refresh</p></div>
<button class="inline-flex cursor-pointer items-center rounded-control px-4 py-2 text-sm font-medium focus-visible:ring-2 bg-danger text-on-accent hover:bg-danger-700" type="button" command="show-modal" commandfor="deleteDialog">Delete</button></div>
<dl class="mt-6 grid grid-cols-[8rem_1fr] gap-y-3 text-sm"><dt class="text-text-dim">Status</dt>
<dd><span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-success/10 text-success capitalize">active</span></dd>
<dt class="text-text-dim">Export</dt>
<dd><span id="projectStatus" class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium bg-primary/10 text-primary" hx-get="/projects/1/status" hx-target="this" hx-swap="outerHTML" hx-trigger="every 2s">Exporting…</span></dd></dl>
<dialog id="deleteDialog" class="w-full max-w-sm rounded-card bg-surface p-6 shadow-lg [&amp;::backdrop]:bg-overlay/40" closedby="any"><h2 class="text-lg font-semibold">Delete project?</h2>
<p class="mt-2 text-sm text-text-dim">&quot;Atlas &lt;redesign&gt;&quot; and its exports will be removed. This cannot be undone.</p>
<div class="mt-6 flex justify-end gap-3"><button class="inline-flex cursor-pointer items-center rounded-control px-4 py-2 text-sm font-medium focus-visible:ring-2 border border-line hover:bg-surface-2" type="button" command="close" commandfor="deleteDialog">Cancel</button>
<button class="cursor-pointer inline-flex cursor-pointer items-center rounded-control px-4 py-2 text-sm font-medium focus-visible:ring-2 bg-danger text-on-accent hover:bg-danger-700" type="button" hx-post="/projects/1/delete" hx-target="#main-content" hx-swap="outerMorph" hx-indicator="#global-loading" hx-disable="this">Delete project</button></div></dialog></main></body></html>
