<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/htmx.js" defer nonce="dGVzdG5vbmNl">
</script>
</head>
<body class="bg-bg text-text">
<main id="main-content" class="mx-auto max-w-3xl p-6">
<header class="flex items-center justify-between gap-4">
<h1 class="text-2xl font-semibold">Projects</h1>
<a href="/projects/new" hx-get="/projects/new" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" class="rounded-control bg-primary px-4 py-2 text-sm font-medium text-on-accent hover:bg-primary-700">New project</a>
</header>
<input type="search" name="q" value="" placeholder="Search projects" aria-label="Search projects" class="mt-6 w-full rounded-control border border-line bg-surface px-3 py-2 focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-hidden" hx-get="/projects/rows" hx-trigger="input changed delay:300ms, search" hx-target="#project-list" hx-swap="outerMorph" hx-sync="this:replace">
<section id="project-list" class="mt-4" aria-label="Projects">
<ul class="divide-y divide-line rounded-card border border-line bg-surface">
<li>
<a href="/projects/1" hx-get="/projects/1" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" class="flex items-center justify-between gap-4 px-4 py-3 hover:bg-surface-2">
<span class="font-medium">Harbour redesign</span>
<span class="text-sm text-text-dim">Luka Koper</span>
</a>
</li>
<li>
<a href="/projects/2" hx-get="/projects/2" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" class="flex items-center justify-between gap-4 px-4 py-3 hover:bg-surface-2">
<span class="font-medium">&lt;img src=x onerror=alert(1)&gt;</span>
<span class="text-sm text-text-dim">&quot;O&#39;Neil&quot; &amp; Sons</span>
</a>
</li>
</ul>
</section>
</main>
</body>
</html>
