<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New project</title>
<link rel="stylesheet" href="/css/app.css">
<script src="/js/htmx.js" defer nonce="dGVzdG5vbmNl">
</script>
</head>
<body class="bg-bg text-text">
<main id="main-content" class="mx-auto max-w-3xl p-6">
<h1 class="text-2xl font-semibold">New project</h1>
<form id="project-form" action="/projects" method="post" hx-post="/projects" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" hx-status:422="target:#project-form swap:outerMorph push:false" novalidate class="mt-6 flex max-w-lg flex-col gap-5">
<div>
<label for="project-form-name" class="block text-sm font-medium">Name</label>
<input name="name" id="project-form-name" type="text" value="" required maxlength="80" class="mt-1 w-full rounded-control border border-line bg-surface px-3 py-2 aria-invalid:border-danger">
</div>
<div>
<label for="project-form-client" class="block text-sm font-medium">Client</label>
<input name="client" id="project-form-client" type="text" value="" required maxlength="80" class="mt-1 w-full rounded-control border border-line bg-surface px-3 py-2 aria-invalid:border-danger">
</div>
<div>
<label for="project-form-budget" class="block text-sm font-medium">Budget (EUR)</label>
<input name="budget" id="project-form-budget" type="number" value="" min="0" step="100" class="mt-1 w-full rounded-control border border-line bg-surface px-3 py-2 aria-invalid:border-danger">
</div>
<div class="flex items-center gap-3">
<button class="rounded-control bg-primary px-4 py-2 text-sm font-medium text-on-accent hover:bg-primary-700 cursor-pointer" type="submit">Create project</button>
<a href="/projects" hx-get="/projects" hx-target="#main-content" hx-swap="outerMorph show:top" hx-push-url="true" class="text-sm text-text-dim hover:underline">Cancel</a>
</div>
</form>
</main>
</body>
</html>
