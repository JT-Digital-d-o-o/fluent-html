<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New project</title><link rel="stylesheet" href="/css/app.css"><script src="/js/htmx.min.js" defer></script></head><body class="bg-surface text-text"><main id="main-content" class="mx-auto max-w-3xl p-6"><h1 class="text-2xl font-semibold text-text">New project</h1><form hx-post="/projects" hx-target="#main-content" hx-swap="outerMorph" hx-status:422="target:#project-form swap:outerMorph push:false" id="project-form" class="mt-6 flex max-w-lg flex-col gap-4"><div class="flex flex-col gap-1"><label for="name" class="text-sm font-medium text-text">Name</label><input name="name" id="name" value="" aria-invalid="true" aria-describedby="name-error" type="text" required maxlength="80" class="rounded-control border border-line bg-surface px-3 py-2 text-text aria-invalid:border-danger"><p id="name-error" class="text-sm text-danger">Name is required</p></div><div class="flex flex-col gap-1"><label for="client" class="text-sm font-medium text-text">Client</label><input name="client" id="client" value="Contoso" type="text" required class="rounded-control border border-line bg-surface px-3 py-2 text-text aria-invalid:border-danger"></div><div class="flex flex-col gap-1"><label for="status" class="text-sm font-medium text-text">Status</label><select name="status" id="status" class="rounded-control border border-line bg-surface px-3 py-2 text-text aria-invalid:border-danger"><option value="active">active</option><option value="paused" selected>paused</option><option value="archived">archived</option></select></div><div class="flex flex-col gap-1"><label for="notes" class="text-sm font-medium text-text">Notes</label><textarea name="notes" id="notes" rows="4" class="rounded-control border border-line bg-surface px-3 py-2 text-text aria-invalid:border-danger">x</textarea></div><div class="flex justify-end gap-3"><a href="/projects" hx-get="/projects" hx-target="#main-content" hx-swap="outerMorph" hx-push-url="true" class="rounded-control border border-line px-4 py-2 text-text hover:bg-surface-2">Cancel</a><button type="submit" class="rounded-control bg-primary px-4 py-2 font-medium text-on-accent hover:bg-primary-700">Create project</button></div></form></main></body></html>
